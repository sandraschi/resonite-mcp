[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resonite-mcp"
version = "1.2.0"
description = "Resonite social VR platform MCP server for natural language control of avatars, worlds, and ProtoFlux scripting"
authors = [
    {name = "Sandra Schipal", email = "sandraschipal@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
    "python-osc>=1.8.0",
    "psutil>=5.9.0",
    "lancedb>=0.17.0",
    "sentence-transformers>=3.0.0",
    "websockets>=12.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "prefab-ui>=0.14.0",
    "charset-normalizer>=3.4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "ruff>=0.16.0,<0.17",
    "pre-commit>=3.0.0",
    "types-aiofiles",
    "types-requests",
]
docs = [
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]

[project.scripts]
resonite-mcp = "resonite_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/sandraschi/resonite-mcp"
Repository = "https://github.com/sandraschi/resonite-mcp"
Issues = "https://github.com/sandraschi/resonite-mcp/issues"
Documentation = "https://resonite-mcp.readthedocs.io/"
Changelog = "https://github.com/sandraschi/resonite-mcp/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resonite_mcp = ["assets/**/*", "templates/**/*"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/resonite_mcp"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "setup.py",
    "resonite_mcp/http_server.py",
    "resonite_mcp/http_functions.py",
    "resonite_mcp/agentic.py",
    "resonite_mcp/cli.py",
    "resonite_mcp/__main__.py",
    "resonite_mcp/rag.py",
    "resonite_mcp/resonite_link.py",
    "resonite_mcp/transport.py",
    "resonite_mcp/plugins/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0,<0.17",
    "prometheus-client>=0.20.0",
    "pre-commit>=4.6.1",
]
