global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: resonite-mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["resonite-mcp:9079"]
        labels:
          service: resonite-mcp

  - job_name: resonite-mcp-http
    metrics_path: /api/metrics
    static_configs:
      - targets: ["resonite-mcp:10979"]
        labels:
          service: resonite-mcp
