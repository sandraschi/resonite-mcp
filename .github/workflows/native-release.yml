name: Native release

on:
  push:
    tags:
      - "v*"

jobs:
  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Pack MCPB
        run: |
          uv run python tools/sync_mcpb_src.py
          uv run python tools/pack_mcpb.py
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        with:
          name: resonite-mcp-mcpb
          path: dist/*.mcpb

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: tauri-apps/setup-tauri@v2
      - run: uv sync
      - name: Build Tauri installer
        run: pwsh -NoLogo -File native/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: resonite-mcp-installer
          path: native/target/release/bundle/nsis/*-setup.exe
